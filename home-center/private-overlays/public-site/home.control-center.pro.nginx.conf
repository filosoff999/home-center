# Dedicated virtual host for the Home Center public site.
# This file intentionally does not modify any other server block.

server {
    listen 80;
    listen [::]:80;
    server_name home.control-center.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/home-center-public/current;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name home.control-center.pro;

    root /var/www/home-center-public/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/home.control-center.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home.control-center.pro/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        default_type text/plain;
        return 200 "home-center-public ok\n";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
