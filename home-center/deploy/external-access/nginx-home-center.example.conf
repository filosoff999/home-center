# Home Center 0.9 operator-owned reverse-proxy example.
# Replace home.example.net and certificate paths before use.  The backend is
# intentionally dc01 only: this file must never introduce automatic failover.

limit_req_zone $binary_remote_addr zone=home_center_external:10m rate=5r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name home.example.net;

    ssl_certificate /etc/nginx/tls/home.example.net.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/home.example.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 64k;
    limit_req zone=home_center_external burst=20 nodelay;

    location / {
        proxy_pass https://192.168.10.254:8443;
        proxy_http_version 1.1;
        proxy_next_upstream off;

        proxy_ssl_server_name on;
        proxy_ssl_name dc01.hm.dm;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/nginx/pki/home-center-web-ca.crt;

        # Overwrite, never append, all accepted provenance headers.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host home.example.net;
        proxy_set_header Host dc01.hm.dm:8443;
        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
}
