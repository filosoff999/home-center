name: Home Center task
description: Проверяемый vertical slice Home Center
title: "[HOME CENTER] "
body:
  - type: input
    id: target_release
    attributes:
      label: Target release
      description: Версия без префикса v, например 0.14.0, либо main для maintenance.
      placeholder: 0.14.0
    validations:
      required: true
  - type: input
    id: workstream
    attributes:
      label: Workstream
      description: ID из .hc-dev/releases.json или новый ID, который будет добавлен в реестр.
      placeholder: certificate-lifecycle
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Цель
      description: Один ограниченный проверяемый vertical slice.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements / contracts
      description: Закрытые требования, API/contracts и явные non-goals.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety, failure и recovery
      description: Fail-closed границы, failure modes, rollback/recovery и production authority.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria / evidence
      description: Проверяемые критерии; используйте Markdown checkboxes и укажите требуемые тесты/CI evidence.
      placeholder: |-
        - [ ] Contract implemented
        - [ ] Negative/security tests pass
        - [ ] Exact-head GitHub CI PASS
        - [ ] Documentation/evidence updated
    validations:
      required: true
