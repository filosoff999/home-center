name: Public export gate

on:
  release:
    types: [published]
  pull_request:
    paths:
      - "tools/public_export.py"
      - "tools/public_source_overlay.py"
      - "tools/public_export_finalize.py"
      - "tools/public_ci_finalize.py"
      - "tools/public_privacy_scan.py"
      - "tools/public_build_artifact.sh"
      - ".github/workflows/public-export.yml"
      - "product/**"
      - "contracts/**"
      - "deploy/runtime/**"
      - "deploy/systemd/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Published stable release tag (vX.Y.Z); blank uses the verification baseline"
        required: false
        type: string

permissions:
  contents: read

env:
  PUBLIC_BASELINE_TAG: "v0.9.1"
  PUBLIC_BASELINE_REVISION: "b6d486a8808b47f67e0072349172d44ee0169bef"

jobs:
  export:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    name: Generate and verify infrastructure-neutral public tree
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exporter branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify exact published stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag || '' }}
        run: |
          set -Eeuo pipefail
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            tag="$(python3 - "$GITHUB_EVENT_PATH" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              event = json.load(stream)
          release = event["release"]
          if release.get("draft") or release.get("prerelease") or not release.get("published_at"):
              raise SystemExit("PUBLIC_RELEASE_EVENT_NOT_STABLE")
          print(release["tag_name"])
          PY
            )"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          else
            tag="$PUBLIC_BASELINE_TAG"
          fi

          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo PUBLIC_RELEASE_TAG_REJECTED >&2; exit 66; }
          version="${BASH_REMATCH[1]}"

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          RELEASE_JSON="$release_json" python3 - "$tag" <<'PY'
          import json, os, sys
          value = json.loads(os.environ["RELEASE_JSON"])
          if value.get("tag_name") != sys.argv[1]:
              raise SystemExit("PUBLIC_RELEASE_TAG_IDENTITY_MISMATCH")
          if value.get("draft") or value.get("prerelease") or not value.get("published_at"):
              raise SystemExit("PUBLIC_RELEASE_NOT_PUBLISHED_STABLE")
          PY

          revision="$(git rev-parse "$tag^{commit}")"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo PUBLIC_RELEASE_REVISION_REJECTED >&2; exit 66; }
          if [ "$tag" = "$PUBLIC_BASELINE_TAG" ]; then
            test "$revision" = "$PUBLIC_BASELINE_REVISION" || { echo PUBLIC_BASELINE_REVISION_CHANGED >&2; exit 66; }
          fi
          source_version="$(git show "$revision:product/control-plane/src/home_center/__init__.py" | awk -F'\"' '/^__version__ = / {print $2}')"
          test "$source_version" = "$version" || { echo PUBLIC_RELEASE_SOURCE_VERSION_MISMATCH >&2; exit 66; }

          printf 'PUBLIC_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
          printf 'PUBLIC_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'PUBLIC_SOURCE_REVISION=%s\n' "$revision" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/home-center-public-source" "$revision"
          test "$(git -C "$RUNNER_TEMP/home-center-public-source" rev-parse HEAD)" = "$revision"
          printf 'PUBLIC_RELEASE_IDENTITY=PASS tag=%s version=%s revision=%s\n' "$tag" "$version" "$revision"

      - name: Apply deterministic public source overlays
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/public_source_overlay.py --source-root "$RUNNER_TEMP/home-center-public-source"

      - name: Generate allowlisted public export
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/home-center-free"
          python3 tools/public_export.py \
            --source-root "$RUNNER_TEMP/home-center-public-source" \
            --output "$out" \
            --version "$PUBLIC_VERSION" \
            --source-revision "$PUBLIC_SOURCE_REVISION" \
            --source-tag "$PUBLIC_TAG"
          python3 tools/public_export_finalize.py --output "$out"
          python3 tools/public_ci_finalize.py --output "$out"
          install -m 0755 tools/public_privacy_scan.py "$out/tools/privacy_scan.py"
          install -m 0755 tools/public_build_artifact.sh "$out/deploy/scripts/build-public-artifact.sh"
          OUT="$out" PYTHONPATH=tools python3 - <<'PY'
          import os
          from pathlib import Path
          import public_export
          root = Path(os.environ["OUT"])
          public_export.scan_private(root)
          public_export.manifest(root)
          print("PUBLIC_POST_FINALIZE_PRIVATE_GATE=PASS")
          PY

      - name: Verify privacy boundary and public shape
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/home-center-free"
          python3 "$out/tools/privacy_scan.py" "$out"
          test ! -e "$out/ops"
          test ! -e "$out/docs"
          test ! -e "$out/product/control-plane/src/home_center/release_candidate.py"
          test ! -e "$out/product/control-plane/src/home_center/tls_activate.py"
          test ! -e "$out/product/control-plane/src/home_center/update_reconcile.py"
          test -f "$out/product/control-plane/src/home_center/tls_status.py"
          test -f "$out/deploy/config/config.node-a.example.json"
          test -f "$out/deploy/config/config.node-b.example.json"
          test -f "$out/deploy/profiles/two-node.example.v1.json"
          test -f "$out/CERTIFICATES.md"
          grep -q 'ControlCenterSoft/home-center-free' "$out/deploy/systemd/home-center.service"
          ! grep -Eq '^IPAddressAllow=' "$out/deploy/systemd/home-center.service"
          grep -q -- '--peer-cert' "$out/deploy/scripts/install-public.sh"
          grep -q -- '--web-cert' "$out/deploy/scripts/install-public.sh"
          grep -q 'WEB_AND_PEER_CERTIFICATES_MUST_DIFFER' "$out/deploy/scripts/install-public.sh"
          grep -q 'sha256sum -c PUBLIC_EXPORT_MANIFEST.sha256' "$out/.github/workflows/ci.yml"
          ! grep -q "python3 - <<'PY'" "$out/.github/workflows/ci.yml"
          ! find "$out" -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .
          ! find "$out" -type d -name __pycache__ -print -quit | grep -q .
          (cd "$out" && sha256sum -c PUBLIC_EXPORT_MANIFEST.sha256)

      - name: Compile and import exported runtime without mutating source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/home-center-free"
          cache="$RUNNER_TEMP/public-pycache"
          mkdir -p "$cache"
          PYTHONPYCACHEPREFIX="$cache" python3 -m compileall -q "$out/product/control-plane/src/home_center" "$out/deploy/runtime"
          PYTHONPYCACHEPREFIX="$cache" PYTHONPATH="$out/product/control-plane/src" \
            python3 -c 'import home_center.server, home_center.api_v2, home_center.runtime, home_center.tls_status'
          ! find "$out" -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .
          ! find "$out" -type d -name __pycache__ -print -quit | grep -q .

      - name: Validate exported JSON
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/home-center-free" python3 - <<'PY'
          import json, os, pathlib
          for path in pathlib.Path(os.environ["OUT"]).rglob("*.json"):
              with path.open(encoding="utf-8") as stream:
                  json.load(stream)
          PY

      - name: Build public artifact twice
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/home-center-free"
          bash "$out/deploy/scripts/build-public-artifact.sh" "$RUNNER_TEMP/public-build-a"
          bash "$out/deploy/scripts/build-public-artifact.sh" "$RUNNER_TEMP/public-build-b"
          cmp "$RUNNER_TEMP/public-build-a/home-center-free-$PUBLIC_VERSION-linux-amd64.tar.gz" \
              "$RUNNER_TEMP/public-build-b/home-center-free-$PUBLIC_VERSION-linux-amd64.tar.gz"
          (cd "$RUNNER_TEMP/public-build-a" && sha256sum -c "home-center-free-$PUBLIC_VERSION-linux-amd64.tar.gz.sha256")

      - name: Scan built artifact content
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir "$RUNNER_TEMP/public-artifact-expanded"
          tar -xzf "$RUNNER_TEMP/public-build-a/home-center-free-$PUBLIC_VERSION-linux-amd64.tar.gz" \
            -C "$RUNNER_TEMP/public-artifact-expanded"
          python3 "$RUNNER_TEMP/home-center-free/tools/privacy_scan.py" "$RUNNER_TEMP/public-artifact-expanded"
          test "$(cat "$RUNNER_TEMP/public-artifact-expanded/VERSION")" = "$PUBLIC_VERSION"
          test "$(cat "$RUNNER_TEMP/public-artifact-expanded/REVISION")" = "$PUBLIC_SOURCE_REVISION"
          ! find "$RUNNER_TEMP/public-artifact-expanded" -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .
          ! find "$RUNNER_TEMP/public-artifact-expanded" -type d -name __pycache__ -print -quit | grep -q .
          (cd "$RUNNER_TEMP/public-artifact-expanded" && sha256sum -c MANIFEST.sha256)

      - name: Package verified public export
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/home-center-free"
          ! find "$out" -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .
          ! find "$out" -type d -name __pycache__ -print -quit | grep -q .
          bundle="$RUNNER_TEMP/public-export-bundle"
          mkdir "$bundle"
          tar --sort=name --mtime='@1767225600' --owner=0 --group=0 --numeric-owner \
            -C "$out" -cf - . | gzip -n -9 > "$bundle/home-center-free-source-$PUBLIC_VERSION.tar.gz"
          cp "$RUNNER_TEMP/public-build-a/home-center-free-$PUBLIC_VERSION-linux-amd64.tar.gz" "$bundle/"
          cp "$RUNNER_TEMP/public-build-a/home-center-free-$PUBLIC_VERSION-linux-amd64.tar.gz.sha256" "$bundle/"
          (cd "$bundle" && sha256sum "home-center-free-source-$PUBLIC_VERSION.tar.gz" > "home-center-free-source-$PUBLIC_VERSION.tar.gz.sha256")
          (cd "$bundle" && sha256sum -c *.sha256)

      - name: Upload verified public export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: home-center-free-public-export-${{ env.PUBLIC_VERSION }}
          path: ${{ runner.temp }}/public-export-bundle/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
