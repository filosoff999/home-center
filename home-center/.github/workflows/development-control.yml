name: Home Center Development Control

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  issues:
    types: [opened, edited, closed, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: home-center-development-control-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development-control:
    name: Repository development control
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""

      - name: Validate development registry
        run: python tools/hc_dev_control.py validate

      - name: Run development-control unit tests
        run: python -m unittest discover -s tests -p 'test_hc_dev_control.py' -v

      - name: Validate Pull Request release binding
        if: ${{ github.event_name == 'pull_request' }}
        run: python tools/hc_dev_control.py pr-gate

      - name: Enforce product-documentation boundary
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          python tools/hc_dev_control.py doc-boundary
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Resolve live repository status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python tools/hc_dev_control.py status --github
          --output-markdown "$RUNNER_TEMP/home-center-development-status.md"
          --output-json "$RUNNER_TEMP/home-center-development-status.json"

      - name: Publish status in job summary
        run: cat "$RUNNER_TEMP/home-center-development-status.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload development status evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: home-center-development-status-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/home-center-development-status.md
            ${{ runner.temp }}/home-center-development-status.json
          if-no-files-found: error
          retention-days: 14
