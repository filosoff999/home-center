name: Publish Home Center 0.9.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-0.9.0.yml"

permissions:
  contents: write

concurrency:
  group: publish-home-center-0.9.0
  cancel-in-progress: false

env:
  SOURCE_SHA: 29b2f61071067028c14febbbaf0103c5600380e9
  EXPECTED_ARTIFACT_SHA256: 66531867f806c6665f41d2bb82dccfb5670403acd0c9988271714da09172f668
  VERSION: 0.9.0
  TAG: v0.9.0
  SOURCE_DATE_EPOCH: "1767225600"

jobs:
  publish:
    name: Verify exact source and publish immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact admitted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 29b2f61071067028c14febbbaf0103c5600380e9
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""
      - name: Re-run release gates and build twice
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          make contracts test e2e security
          HOME_CENTER_VERSION="$VERSION" HOME_CENTER_REVISION="$SOURCE_SHA" HOME_CENTER_RELEASE_BUILD=1 \
            bash deploy/scripts/build-artifact.sh "$RUNNER_TEMP/home-center-090-first"
          HOME_CENTER_VERSION="$VERSION" HOME_CENTER_REVISION="$SOURCE_SHA" HOME_CENTER_RELEASE_BUILD=1 \
            bash deploy/scripts/build-artifact.sh "$RUNNER_TEMP/home-center-090-second"
          cmp "$RUNNER_TEMP/home-center-090-first/home-center-$VERSION-linux-amd64.tar.gz" \
              "$RUNNER_TEMP/home-center-090-second/home-center-$VERSION-linux-amd64.tar.gz"
          cd "$RUNNER_TEMP/home-center-090-first"
          sha256sum -c "home-center-$VERSION-linux-amd64.tar.gz.sha256"
          actual="$(sha256sum "home-center-$VERSION-linux-amd64.tar.gz" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_ARTIFACT_SHA256"
          test "$(tar -xOf "home-center-$VERSION-linux-amd64.tar.gz" ./VERSION)" = "$VERSION"
          test "$(tar -xOf "home-center-$VERSION-linux-amd64.tar.gz" ./REVISION)" = "$SOURCE_SHA"
          test -n "$(tar -xOf "home-center-$VERSION-linux-amd64.tar.gz" ./release-candidate-verify.py)"
      - name: Publish exact GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          artifact="$RUNNER_TEMP/home-center-090-first/home-center-$VERSION-linux-amd64.tar.gz"
          checksum="$artifact.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
            test "$tag_sha" = "$SOURCE_SHA"
            assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            grep -Fx "home-center-$VERSION-linux-amd64.tar.gz" <<<"$assets"
            grep -Fx "home-center-$VERSION-linux-amd64.tar.gz.sha256" <<<"$assets"
            exit 0
          fi
          gh release create "$TAG" "$artifact" "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Home Center $VERSION" \
            --notes-file docs/RELEASE-NOTES-0.9.0.md
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$tag_sha" = "$SOURCE_SHA"
