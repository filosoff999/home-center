name: Home Center 0.9.1 browser acceptance

on:
  push:
    branches:
      - release/0.9.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-center-091-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    name: HC-WEB-001 desktop and Android-like Chrome
    if: ${{ github.ref_name == 'release/0.9.1' || github.head_ref == 'release/0.9.1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve exact release identity
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(awk -F'"' '/^__version__ = / {print $2}' product/control-plane/src/home_center/__init__.py)"
          test "$version" = 0.9.1
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "revision=$GITHUB_SHA" >>"$GITHUB_OUTPUT"
      - name: Build browser-tested artifact twice
        env:
          HOME_CENTER_VERSION: ${{ steps.identity.outputs.version }}
          HOME_CENTER_REVISION: ${{ steps.identity.outputs.revision }}
          HOME_CENTER_RELEASE_BUILD: "1"
          SOURCE_DATE_EPOCH: "1767225600"
        shell: bash
        run: |
          set -Eeuo pipefail
          make contracts security
          bash deploy/scripts/build-artifact.sh "$RUNNER_TEMP/browser-first"
          bash deploy/scripts/build-artifact.sh "$RUNNER_TEMP/browser-second"
          artifact="home-center-$HOME_CENTER_VERSION-linux-amd64.tar.gz"
          cmp "$RUNNER_TEMP/browser-first/$artifact" "$RUNNER_TEMP/browser-second/$artifact"
          (cd "$RUNNER_TEMP/browser-first" && sha256sum -c "$artifact.sha256")
          sha256sum "$RUNNER_TEMP/browser-first/$artifact"
          mkdir -p "$RUNNER_TEMP/browser-release"
          tar -xzf "$RUNNER_TEMP/browser-first/$artifact" -C "$RUNNER_TEMP/browser-release"
          test "$(cat "$RUNNER_TEMP/browser-release/VERSION")" = "$HOME_CENTER_VERSION"
          test "$(cat "$RUNNER_TEMP/browser-release/REVISION")" = "$HOME_CENTER_REVISION"
      - name: Run desktop and Android-like Chrome acceptance
        env:
          HOME_CENTER_VERSION: ${{ steps.identity.outputs.version }}
          HOME_CENTER_REVISION: ${{ steps.identity.outputs.revision }}
        shell: bash
        run: |
          set -Eeuo pipefail
          google-chrome --version
          chromedriver --version
          python3 tests/browser_hc_web_091.py \
            --web-root "$RUNNER_TEMP/browser-release/web" \
            --expected-version "$HOME_CENTER_VERSION" \
            --expected-revision "$HOME_CENTER_REVISION"
