name: Publish Home Center 0.10.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-0.10.0.yml"

permissions:
  contents: write

concurrency:
  group: publish-home-center-0.10.0
  cancel-in-progress: false

env:
  SOURCE_SHA: 4e59e74124cdb710df63b93ba33e6b91e6452398
  EXPECTED_ARTIFACT_SHA256: 2ab735eb4919c01801f3aeb6bd686670f1ae95155abd283bae7c42362ffc978d
  EXPECTED_ARTIFACT_BYTES: "156847"
  VERSION: 0.10.0
  TAG: v0.10.0
  SOURCE_DATE_EPOCH: "1767225600"

jobs:
  publish:
    name: Verify exact source, browser acceptance and publish immutable release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact admitted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 4e59e74124cdb710df63b93ba33e6b91e6452398
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""
      - name: Re-run release gates and build exact artifact twice
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(awk -F'"' '/^__version__ = / {print $2}' product/control-plane/src/home_center/__init__.py)" = "$VERSION"
          make contracts test e2e security
          HOME_CENTER_VERSION="$VERSION" HOME_CENTER_REVISION="$SOURCE_SHA" HOME_CENTER_RELEASE_BUILD=1 SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            bash deploy/scripts/build-artifact.sh "$RUNNER_TEMP/home-center-0100-first"
          HOME_CENTER_VERSION="$VERSION" HOME_CENTER_REVISION="$SOURCE_SHA" HOME_CENTER_RELEASE_BUILD=1 SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            bash deploy/scripts/build-artifact.sh "$RUNNER_TEMP/home-center-0100-second"
          first="$RUNNER_TEMP/home-center-0100-first/home-center-$VERSION-linux-amd64.tar.gz"
          second="$RUNNER_TEMP/home-center-0100-second/home-center-$VERSION-linux-amd64.tar.gz"
          cmp "$first" "$second"
          (cd "$RUNNER_TEMP/home-center-0100-first" && sha256sum -c "home-center-$VERSION-linux-amd64.tar.gz.sha256")
          actual="$(sha256sum "$first" | awk '{print $1}')"
          bytes="$(wc -c <"$first" | tr -d ' ')"
          test "$actual" = "$EXPECTED_ARTIFACT_SHA256"
          test "$bytes" = "$EXPECTED_ARTIFACT_BYTES"
          test "$(tar -xOf "$first" ./VERSION)" = "$VERSION"
          test "$(tar -xOf "$first" ./REVISION)" = "$SOURCE_SHA"
          test -n "$(tar -xOf "$first" ./release-candidate-verify.py)"
      - name: Run desktop and Android-like Chrome against exact release bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact="$RUNNER_TEMP/home-center-0100-first/home-center-$VERSION-linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/home-center-0100-browser"
          tar -xzf "$artifact" -C "$RUNNER_TEMP/home-center-0100-browser"
          google-chrome --version
          chromedriver --version
          python3 tests/browser_hc_web_091.py \
            --web-root "$RUNNER_TEMP/home-center-0100-browser/web" \
            --expected-version "$VERSION" \
            --expected-revision "$SOURCE_SHA"
      - name: Publish exact GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          artifact="$RUNNER_TEMP/home-center-0100-first/home-center-$VERSION-linux-amd64.tar.gz"
          checksum="$artifact.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
            test "$tag_sha" = "$SOURCE_SHA"
            digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name == "home-center-'"$VERSION"'-linux-amd64.tar.gz") | .digest')"
            test "$digest" = "sha256:$EXPECTED_ARTIFACT_SHA256"
            size="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name == "home-center-'"$VERSION"'-linux-amd64.tar.gz") | .size')"
            test "$size" = "$EXPECTED_ARTIFACT_BYTES"
            assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            grep -Fx "home-center-$VERSION-linux-amd64.tar.gz" <<<"$assets"
            grep -Fx "home-center-$VERSION-linux-amd64.tar.gz.sha256" <<<"$assets"
            exit 0
          fi
          gh release create "$TAG" "$artifact" "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Home Center $VERSION" \
            --notes-file docs/RELEASE-NOTES-0.10.0.md
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$tag_sha" = "$SOURCE_SHA"
          digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name == "home-center-'"$VERSION"'-linux-amd64.tar.gz") | .digest')"
          test "$digest" = "sha256:$EXPECTED_ARTIFACT_SHA256"
          size="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name == "home-center-'"$VERSION"'-linux-amd64.tar.gz") | .size')"
          test "$size" = "$EXPECTED_ARTIFACT_BYTES"
