name: Publish Home Center 0.10.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-0.10.0.yml"

permissions:
  contents: write

concurrency:
  group: publish-home-center-0.10.0
  cancel-in-progress: false

env:
  SOURCE_SHA: 4e59e74124cdb710df63b93ba33e6b91e6452398
  EXPECTED_ARTIFACT_SHA256: 2ab735eb4919c01801f3aeb6bd686670f1ae95155abd283bae7c42362ffc978d
  EXPECTED_ARTIFACT_BYTES: "156847"
  VERSION: 0.10.0
  TAG: v0.10.0
  SOURCE_DATE_EPOCH: "1767225600"

jobs:
  publish:
    name: Verify exact source, browser acceptance and publish immutable release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact admitted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 4e59e74124cdb710df63b93ba33e6b91e6452398
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""
      - name: Re-run release gates and build exact artifact twice
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(awk -F'"' '/^__version__ = / {print $2}' product/control-plane/src/home_center/__init__.py)" = "$VERSION"
          make contracts test e2e security
          HOME_CENTER_VERSION="$VERSION" HOME_CENTER_REVISION="$SOURCE_SHA" HOME_CENTER_RELEASE_BUILD=1 SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            bash deploy/scripts/build-artifact.sh "$RUNNER_TEMP/home-center-0100-first"
          HOME_CENTER_VERSION="$VERSION" HOME_CENTER_REVISION="$SOURCE_SHA" HOME_CENTER_RELEASE_BUILD=1 SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            bash deploy/scripts/build-artifact.sh "$RUNNER_TEMP/home-center-0100-second"
          first="$RUNNER_TEMP/home-center-0100-first/home-center-$VERSION-linux-amd64.tar.gz"
          second="$RUNNER_TEMP/home-center-0100-second/home-center-$VERSION-linux-amd64.tar.gz"
          cmp "$first" "$second"
          (cd "$RUNNER_TEMP/home-center-0100-first" && sha256sum -c "home-center-$VERSION-linux-amd64.tar.gz.sha256")
          actual="$(sha256sum "$first" | awk '{print $1}')"
          bytes="$(wc -c <"$first" | tr -d ' ')"
          test "$actual" = "$EXPECTED_ARTIFACT_SHA256"
          test "$bytes" = "$EXPECTED_ARTIFACT_BYTES"
          test "$(tar -xOf "$first" ./VERSION)" = "$VERSION"
          test "$(tar -xOf "$first" ./REVISION)" = "$SOURCE_SHA"
          test -n "$(tar -xOf "$first" ./release-candidate-verify.py)"
      - name: Run desktop and Android-like Chrome against exact release bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact="$RUNNER_TEMP/home-center-0100-first/home-center-$VERSION-linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/home-center-0100-browser"
          tar -xzf "$artifact" -C "$RUNNER_TEMP/home-center-0100-browser"
          google-chrome --version
          chromedriver --version
          python3 tests/browser_hc_web_091.py \
            --web-root "$RUNNER_TEMP/home-center-0100-browser/web" \
            --expected-version "$VERSION" \
            --expected-revision "$SOURCE_SHA"
      - name: Publish exact GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          artifact="$RUNNER_TEMP/home-center-0100-first/home-center-$VERSION-linux-amd64.tar.gz"
          checksum="$artifact.sha256"
          notes="$RUNNER_TEMP/release-notes-0.10.0.md"
          cat >"$notes" <<'EOF'
          # Home Center 0.10.0

          Home Center 0.10.0 establishes the versioned Core planning boundary while preserving the accepted 0.9.2 runtime, authentication, release-integrity and two-node safety controls.

          ## Exact predecessor

          - version: `0.9.2`;
          - source revision: `689d90995a4f365e2f19640486b136b525f29c6d`;
          - artifact SHA-256: `90d5cb0b657abfdd13f077b4a2347c5066fbaddcd4f4bfa6b25944e73a8abe87`.

          ## Core foundation

          - closed command, result and error schemas;
          - typed input and output contracts for the five admitted planning actions;
          - plan-only Node, Upgrade, Configuration, Service and Policy modules;
          - exact action dispatch and an explicit API compatibility matrix;
          - default-deny policy behavior and deterministic dependency planning.

          ## Safety boundary

          The new Core can validate requests and describe plans. It has no executor, process runner, filesystem mutation surface, network client, scheduler, reconciler or production activation authority. No public Core HTTP route is introduced in this release.

          Publishing `v0.10.0` is not production deployment authority. The accepted production baseline remains Home Center `0.9.2` on `dc01` and `dc02`; any future 0.10 rollout still requires separate authorization, exact version/revision/artifact admission and the staged `dc02 -> canary/soak -> dc01` procedure.

          The 0.9.x feature line is closed on the published `v0.9.2` release. Any later 0.9.x security or maintenance exception requires explicit authorization.

          Documentation correction: an earlier generated note named 0.7.0 as the production baseline. The authoritative accepted baseline at publication is the exact 0.9.2 identity; the `v0.10.0` tag and immutable assets were not changed by this correction.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
            test "$tag_sha" = "$SOURCE_SHA"
            digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name == "home-center-'"$VERSION"'-linux-amd64.tar.gz") | .digest')"
            test "$digest" = "sha256:$EXPECTED_ARTIFACT_SHA256"
            size="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name == "home-center-'"$VERSION"'-linux-amd64.tar.gz") | .size')"
            test "$size" = "$EXPECTED_ARTIFACT_BYTES"
            assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            grep -Fx "home-center-$VERSION-linux-amd64.tar.gz" <<<"$assets"
            grep -Fx "home-center-$VERSION-linux-amd64.tar.gz.sha256" <<<"$assets"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.body' | \
              grep -F 'accepted production baseline remains Home Center `0.9.2`'
            exit 0
          fi
          gh release create "$TAG" "$artifact" "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Home Center $VERSION" \
            --notes-file "$notes"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$tag_sha" = "$SOURCE_SHA"
          digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name == "home-center-'"$VERSION"'-linux-amd64.tar.gz") | .digest')"
          test "$digest" = "sha256:$EXPECTED_ARTIFACT_SHA256"
          size="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name == "home-center-'"$VERSION"'-linux-amd64.tar.gz") | .size')"
          test "$size" = "$EXPECTED_ARTIFACT_BYTES"
