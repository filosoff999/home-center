name: Publish Home Center 0.8.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-0.8.0.yml"

permissions:
  contents: write

concurrency:
  group: publish-home-center-0.8.0
  cancel-in-progress: false

env:
  SOURCE_SHA: bbb2b1e952b2072c8ce30ad6b3220c7c14280949
  EXPECTED_ARTIFACT_SHA256: 25fb72fdffab972703d9be2b7e457b1f4ed053bc1c013a6237558fd693e73ca8
  VERSION: 0.8.0
  TAG: v0.8.0
  SOURCE_DATE_EPOCH: "1767225600"

jobs:
  publish:
    name: Verify exact source and publish immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact admitted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: bbb2b1e952b2072c8ce30ad6b3220c7c14280949
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""
      - name: Re-run release gates and build twice
        shell: bash
        env:
          HOME_CENTER_VERSION: 0.8.0
          HOME_CENTER_REVISION: bbb2b1e952b2072c8ce30ad6b3220c7c14280949
          HOME_CENTER_RELEASE_BUILD: "1"
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          make contracts test security
          bash deploy/scripts/build-artifact.sh "$RUNNER_TEMP/home-center-080-first"
          bash deploy/scripts/build-artifact.sh "$RUNNER_TEMP/home-center-080-second"
          cmp "$RUNNER_TEMP/home-center-080-first/home-center-$VERSION-linux-amd64.tar.gz" \
              "$RUNNER_TEMP/home-center-080-second/home-center-$VERSION-linux-amd64.tar.gz"
          cd "$RUNNER_TEMP/home-center-080-first"
          sha256sum -c "home-center-$VERSION-linux-amd64.tar.gz.sha256"
          actual="$(sha256sum "home-center-$VERSION-linux-amd64.tar.gz" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_ARTIFACT_SHA256"
          test "$(tar -xOf "home-center-$VERSION-linux-amd64.tar.gz" ./VERSION)" = "$VERSION"
          test "$(tar -xOf "home-center-$VERSION-linux-amd64.tar.gz" ./REVISION)" = "$SOURCE_SHA"
      - name: Publish exact GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          artifact="$RUNNER_TEMP/home-center-080-first/home-center-$VERSION-linux-amd64.tar.gz"
          checksum="$artifact.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
            test "$tag_sha" = "$SOURCE_SHA"
            assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            grep -Fx "home-center-$VERSION-linux-amd64.tar.gz" <<<"$assets"
            grep -Fx "home-center-$VERSION-linux-amd64.tar.gz.sha256" <<<"$assets"
            exit 0
          fi
          gh release create "$TAG" "$artifact" "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Home Center $VERSION" \
            --notes-file docs/RELEASE-NOTES-0.8.0.md
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$tag_sha" = "$SOURCE_SHA"
