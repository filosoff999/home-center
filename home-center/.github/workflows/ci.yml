name: Home Center CI

on:
  pull_request:
  push:
    branches:
      - main
      - "bootstrap/**"
      - "dev/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-center-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-gates:
    name: Python ${{ matrix.python }} deterministic gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: ""
      - name: Compile runtime
        run: python -m compileall -q product/control-plane/src
      - name: Run contracts, tests and security gates
        run: make contracts test security

  artifact:
    name: Reproducible deployment artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deterministic-gates
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build artifact
        env:
          HOME_CENTER_REVISION: ${{ github.sha }}
          SOURCE_DATE_EPOCH: "1767225600"
        run: make contracts security build
      - name: Verify artifact checksum
        working-directory: dist
        run: sha256sum -c home-center-0.1.0-linux-amd64.tar.gz.sha256
      - name: Upload immutable candidate
        uses: actions/upload-artifact@v4
        with:
          name: home-center-0.1.0-linux-amd64-${{ github.sha }}
          path: |
            dist/home-center-0.1.0-linux-amd64.tar.gz
            dist/home-center-0.1.0-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
