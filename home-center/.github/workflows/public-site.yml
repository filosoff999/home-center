name: Home Center public site

on:
  pull_request:
    paths:
      - 'website/**'
      - 'deploy/public-site/**'
      - 'tests/validate_public_site.py'
      - '.github/workflows/public-site.yml'
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'deploy/public-site/**'
      - 'tests/validate_public_site.py'
      - '.github/workflows/public-site.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate public website boundary
        run: python3 tests/validate_public_site.py
      - name: Validate deployment shell
        run: bash -n deploy/public-site/deploy.sh
