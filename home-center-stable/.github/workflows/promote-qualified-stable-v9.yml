name: Prepare qualified Home Center stable promotion v9

on:
  create:

permissions:
  contents: write

concurrency:
  group: home-center-stable-promotion-v9-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'ControlCenterSoft/home-center-stable' &&
      github.ref_type == 'branch' &&
      (startsWith(github.ref_name, 'promote9/') || startsWith(github.ref_name, 'promote9r2/'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_REPOSITORY: ControlCenterSoft/home-center-development
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact public boundary
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: ""

      - name: Resolve canonical identity
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "$1" >&2; exit 66; }
          version="${GITHUB_REF_NAME#*/}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail PROMOTION_VERSION_REJECTED
          public_base="$(git rev-parse HEAD)"
          main_record="$(git ls-remote --exit-code origin refs/heads/main)" || fail MAIN_IDENTITY_CHECK_FAILED
          [[ "$main_record" == "$public_base"$'\trefs/heads/main' ]] || fail PROMOTION_NOT_CREATED_FROM_MAIN
          old_approved="$(python3 - <<'PY'
          import json
          print(json.load(open('APPROVED-SOURCE.json', encoding='utf-8'))['approved_revision'])
          PY
          )"
          test "$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/v$version" --jq .draft)" = "false" || fail SOURCE_RELEASE_DRAFT
          test "$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/v$version" --jq .prerelease)" = "false" || fail SOURCE_RELEASE_PRERELEASE
          assets="$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/v$version" --jq '.assets | length')"
          [[ "$assets" =~ ^[0-9]+$ ]] && (( assets >= 2 )) || fail SOURCE_RELEASE_ASSETS_INCOMPLETE
          git remote add approved "https://github.com/$SOURCE_REPOSITORY.git"
          git fetch --no-tags approved main
          git fetch --force approved "refs/tags/v$version:refs/tags/source-v$version"
          git cat-file -e "$old_approved^{commit}" || fail APPROVED_REVISION_UNAVAILABLE
          source_sha="$(git rev-parse "refs/tags/source-v$version^{}")"
          test "$(git show "$source_sha:VERSION")" = "$version" || fail SOURCE_VERSION_MISMATCH
          git merge-base --is-ancestor "$old_approved" "$source_sha" || fail SOURCE_NOT_DESCENDANT_OF_APPROVED_BASE
          git worktree add --detach "$RUNNER_TEMP/source" "$source_sha"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "public_base=$public_base" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Build sanitized public tree
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/source" "$VERSION" <<'PY'
          import json, re, shutil, sys
          from pathlib import Path

          source = Path(sys.argv[1])
          version = sys.argv[2]
          root = Path.cwd()
          provenance = json.loads((root / 'APPROVED-SOURCE.json').read_text(encoding='utf-8'))
          old_version = provenance['version']
          previous = {item['path']: item for item in provenance['files']}
          forbidden_parts = {'.git','__pycache__','dist','.hc-dev','.idea','.vscode','docs','ops','secrets'}
          runtime_prefix = 'product/control-plane/src/home_center/'
          preserve_public_runtime = {'module_admission.py','product_boundary.py'}
          forbidden_runtime = {
              'module_artifact.py','privileged_helper_v2.py','qualification_0140.py',
              'release_candidate.py','release_channel.py','release_manager.py',
              'tls_activate.py','tls_maintenance.py','tls_reconcile.py',
              'update_reconcile.py','upgrade_policy.py',
          }

          def excluded_source(rel: str) -> bool:
              parts = set(rel.split('/'))
              return bool(parts & forbidden_parts) or rel == 'GEMINI.md' or rel.startswith('.github/') or rel.startswith('contracts/releases/') or rel.endswith(('.pyc','.pyo'))

          current = set()
          for path in sorted(source.rglob('*'), key=lambda item: item.as_posix()):
              if not path.is_file() or path.is_symlink():
                  continue
              rel = path.relative_to(source).as_posix()
              current.add(rel)
              if excluded_source(rel):
                  continue
              prior = previous.get(rel)
              if rel.startswith(runtime_prefix):
                  name = Path(rel).name
                  if name in forbidden_runtime or name in preserve_public_runtime:
                      continue
                  if prior is not None and prior['disposition'] == 'adapted':
                      continue
              else:
                  if prior is not None and prior['disposition'] in {'excluded','adapted'}:
                      continue
                  if prior is None and (rel.startswith('tests/') or rel.startswith('scripts/')):
                      continue
              target = root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, target)

          runtime = root / runtime_prefix
          for name in forbidden_runtime:
              path = runtime / name
              if path.is_file():
                  path.unlink()

          for rel, prior in previous.items():
              if prior['disposition'] == 'identical' and rel not in current and not excluded_source(rel):
                  target = root / rel
                  if target.is_file() and not target.is_symlink():
                      target.unlink()

          for name in ('docs','dist','ops','secrets','.hc-dev'):
              shutil.rmtree(root / name, ignore_errors=True)
          for path in list(root.rglob('__pycache__')):
              if path.is_dir():
                  shutil.rmtree(path)
          for path in list(root.rglob('*.pyc')) + list(root.rglob('*.pyo')):
              if path.is_file():
                  path.unlink()
          gemini = root / 'GEMINI.md'
          if gemini.is_file():
              gemini.unlink()
          openapi = root / 'contracts/openapi'
          if openapi.is_dir():
              for path in openapi.iterdir():
                  if path.is_file() and path.name != 'home-center.v1.openapi.json':
                      path.unlink()

          for name in ('README.md','INSTALL.md','RELEASE.md','contracts/README.md'):
              path = root / name
              if path.is_file():
                  path.write_text(path.read_text(encoding='utf-8').replace(f'v{old_version}', f'v{version}').replace(old_version, version), encoding='utf-8')
          pyproject = root / 'pyproject.toml'
          if pyproject.is_file():
              text, count = re.subn(r'(?m)^version\s*=\s*"[0-9]+\.[0-9]+\.[0-9]+"\s*$', f'version = "{version}"', pyproject.read_text(encoding='utf-8'), count=1)
              if count != 1:
                  raise SystemExit('PUBLIC_PROJECT_VERSION_UPDATE_FAILED')
              pyproject.write_text(text, encoding='utf-8')
          release_js = root / 'product/web/static/release.js'
          if release_js.is_file():
              release_js.write_text(re.sub(r'version:\s*"[0-9]+\.[0-9]+\.[0-9]+"', f'version: "{version}"', release_js.read_text(encoding='utf-8'), count=1), encoding='utf-8')
          index = root / 'product/web/static/index.html'
          if index.is_file():
              text = index.read_text(encoding='utf-8').replace(old_version, version)
              if (root / 'product/web/static/device-enrollment.js').is_file():
                  required = [
                      '<script src="/static/device-registration.js"></script>',
                      '<script src="/static/device-management-plan.js"></script>',
                      '<script src="/static/device-enrollment.js"></script>',
                  ]
                  if (root / 'product/web/static/device-provider-resolution.js').is_file():
                      required.append('<script src="/static/device-provider-resolution.js"></script>')
                  insertion = ''.join(f'  {item}\n' for item in required if item not in text)
                  if insertion:
                      if '</body>' not in text:
                          raise SystemExit('PUBLIC_WEB_BODY_MISSING')
                      text = text.replace('</body>', insertion + '</body>', 1)
              index.write_text(text, encoding='utf-8')

          for wf in (
              'promote-qualified-stable.yml','promote-qualified-stable-v2.yml','promote-qualified-stable-v3.yml',
              'promote-qualified-stable-v4.yml','promote-qualified-stable-v5.yml','promote-qualified-stable-v6.yml',
              'promote-qualified-stable-v7.yml','promote-qualified-stable-v8.yml','promote-qualified-stable-v9.yml',
          ):
              path = root / '.github/workflows' / wf
              if path.is_file():
                  path.unlink()
          if (root / 'VERSION').read_text(encoding='ascii').strip() != version:
              raise SystemExit('PUBLIC_VERSION_MISMATCH')
          PY

      - name: Rebuild provenance and source manifest
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          PUBLIC_BASE: ${{ steps.identity.outputs.public_base }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/source" "$SOURCE_SHA" "$PUBLIC_BASE" "$VERSION" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          source = Path(sys.argv[1]); source_sha, public_base, version = sys.argv[2:]; root = Path.cwd()
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          files = []
          for path in sorted(source.rglob('*'), key=lambda item: item.as_posix()):
              if not path.is_file() or path.is_symlink(): continue
              rel = path.relative_to(source).as_posix(); parts = set(rel.split('/'))
              if parts & {'.git','__pycache__','dist'} or rel.endswith(('.pyc','.pyo')): continue
              approved = sha(path); stable = root / rel
              if stable.is_file() and not stable.is_symlink():
                  stable_sha = sha(stable); disposition = 'identical' if stable_sha == approved else 'adapted'; reason = 'approved-byte-copy' if disposition == 'identical' else 'hardened-stable-integration'
              else:
                  stable_sha = None; disposition = 'excluded'
                  if rel.startswith('.github/'): reason = 'stable-release-boundary'
                  elif rel.startswith('docs/') or rel == 'GEMINI.md': reason = 'stable-release-documentation'
                  else: reason = 'stable-public-surface'
              files.append({'path':rel,'approved_sha256':approved,'disposition':disposition,'stable_sha256':stable_sha,'reason':reason})
          rows = ''.join(f"{item['approved_sha256']}  {item['path']}\n" for item in files).encode()
          counts = {name: sum(item['disposition'] == name for item in files) for name in ('identical','adapted','excluded')}
          value = {'schema':'home-center.approved-source-provenance.v1','product':'home-center','version':version,'approved_repository':'ControlCenterSoft/home-center-development','approved_revision':source_sha,'approved_manifest_sha256':hashlib.sha256(rows).hexdigest(),'stable_release_boundary_revision':public_base,'summary':{'total':len(files),**counts},'files':files}
          Path('APPROVED-SOURCE.json').write_text(json.dumps(value, indent=2, ensure_ascii=True) + '\n', encoding='utf-8')
          PY
          python3 - "$SOURCE_SHA" "$PUBLIC_BASE" <<'PY'
          from pathlib import Path
          import re, sys
          source_sha, public_base = sys.argv[1:]
          path = Path('tests/test_approved_source.py')
          if path.is_file():
              text = path.read_text(encoding='utf-8')
              text, n1 = re.subn(r'APPROVED_REVISION = "[0-9a-f]{40}"', f'APPROVED_REVISION = "{source_sha}"', text, count=1)
              text, n2 = re.subn(r'STABLE_RELEASE_BOUNDARY_REVISION = "[0-9a-f]{40}"', f'STABLE_RELEASE_BOUNDARY_REVISION = "{public_base}"', text, count=1)
              if (n1,n2) != (1,1): raise SystemExit('PROVENANCE_TEST_CONSTANT_UPDATE_FAILED')
              path.write_text(text, encoding='utf-8')
          PY
          rm -f SOURCE-MANIFEST.sha256
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          root = Path.cwd(); ignored = {'.git','__pycache__'}; forbidden = {'.hc-dev','.idea','.vscode','dist','docs','ops','secrets'}; records = []
          for directory, names, files in os.walk(root, topdown=True, followlinks=False):
              base = Path(directory); rel_dir = base.relative_to(root); names[:] = sorted(name for name in names if name not in ignored)
              if set(rel_dir.parts) & forbidden: raise SystemExit(f'FORBIDDEN_SOURCE_DIRECTORY:{rel_dir.as_posix()}')
              for name in sorted(files):
                  path = base / name; rel = path.relative_to(root)
                  if name == 'SOURCE-MANIFEST.sha256' or set(rel.parts) & ignored: continue
                  if set(rel.parts) & forbidden: raise SystemExit(f'FORBIDDEN_SOURCE_PATH:{rel.as_posix()}')
                  if path.is_symlink() or not path.is_file() or path.suffix in {'.pyc','.pyo'}: raise SystemExit(f'SPECIAL_SOURCE_FILE:{rel.as_posix()}')
                  records.append((rel.as_posix(), hashlib.sha256(path.read_bytes()).hexdigest()))
          records.sort(key=lambda item: item[0])
          Path('SOURCE-MANIFEST.sha256').write_text(''.join(f'{digest}  {rel}\n' for rel,digest in records), encoding='ascii')
          PY

      - name: Qualify affected public export surface
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 deploy/scripts/build-release.py verify-source --source-root .
          PYTHONPATH=product/control-plane/src python3 -m unittest discover -v -s tests -p 'test_*.py'
          python3 tests/security_gate_public_release.py
          PYTHONPATH=product/control-plane/src python3 -c 'import home_center.actions, home_center.api, home_center.module_admission, home_center.server'

      - name: Commit exact public candidate
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "release: prepare Home Center $VERSION public stable"
          git push origin "HEAD:$GITHUB_REF_NAME"
          printf 'HOME_CENTER_PUBLIC_EXPORT=PASS version=%s candidate=%s\n' "$VERSION" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
