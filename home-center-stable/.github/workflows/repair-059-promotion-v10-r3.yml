name: Repair HC 0.59 promotion v10 r3

on:
  push:
    branches:
      - fix/0.59-promotion-v10-r3-b1

permissions:
  contents: write

concurrency:
  group: hc-059-promotion-v10-r3-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: ""

      - name: Add guarded r3 retry and cumulative Web script insertion
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/promote-qualified-stable-v10.yml')
          text = workflow.read_text(encoding='utf-8')

          old = "      (startsWith(github.ref_name, 'promote10/') || startsWith(github.ref_name, 'promote10r2/'))\n"
          new = "      (startsWith(github.ref_name, 'promote10/') || startsWith(github.ref_name, 'promote10r2/') || startsWith(github.ref_name, 'promote10r3/'))\n"
          if old not in text:
              raise SystemExit('PROMOTION_PREFIX_MARKER_MISSING')
          text = text.replace(old, new, 1)

          old = '''          index = root / 'product/web/static/index.html'\n          if index.is_file():\n              text = index.read_text(encoding='utf-8').replace(old_version, version)\n              if (root / 'product/web/static/device-enrollment.js').is_file():\n                  required = (\n                      '<script src="/static/device-registration.js"></script>',\n                      '<script src="/static/device-management-plan.js"></script>',\n                      '<script src="/static/device-enrollment.js"></script>',\n                  )\n                  insertion = ''.join(f'  {item}\\n' for item in required if item not in text)\n                  if insertion:\n                      if '</body>' not in text:\n                          raise SystemExit('PUBLIC_WEB_BODY_MISSING')\n                      text = text.replace('</body>', insertion + '</body>', 1)\n              index.write_text(text, encoding='utf-8')\n'''
          new = '''          index = root / 'product/web/static/index.html'\n          if index.is_file():\n              text = index.read_text(encoding='utf-8').replace(old_version, version)\n              required = []\n              if (root / 'product/web/static/device-enrollment.js').is_file():\n                  required.extend((\n                      '<script src="/static/device-registration.js"></script>',\n                      '<script src="/static/device-management-plan.js"></script>',\n                      '<script src="/static/device-enrollment.js"></script>',\n                  ))\n              if (root / 'product/web/static/device-provider-resolution.js').is_file():\n                  required.append('<script src="/static/device-provider-resolution.js"></script>')\n              if (root / 'product/web/static/policy-effective-state.js').is_file():\n                  required.append('<script src="/static/policy-effective-state.js"></script>')\n              insertion = ''.join(f'  {item}\\n' for item in required if item not in text)\n              if insertion:\n                  if '</body>' not in text:\n                      raise SystemExit('PUBLIC_WEB_BODY_MISSING')\n                  text = text.replace('</body>', insertion + '</body>', 1)\n              index.write_text(text, encoding='utf-8')\n'''
          if old not in text:
              raise SystemExit('PUBLIC_WEB_INSERTION_MARKER_MISSING')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_stable_promotion_v10_contract.py')
          test_text = test.read_text(encoding='utf-8')
          marker = '\n\nif __name__ == "__main__":\n'
          if marker not in test_text:
              raise SystemExit('PROMOTION_CONTRACT_TEST_MARKER_MISSING')
          addition = '''\n    def test_r3_retry_preserves_exact_version_and_cumulative_web_dependency_order(self) -> None:\n        text = WORKFLOW.read_text(encoding="utf-8")\n        self.assertIn("startsWith(github.ref_name, 'promote10r3/')", text)\n        self.assertIn("device-provider-resolution.js", text)\n        self.assertIn("policy-effective-state.js", text)\n        self.assertIn("required.append('<script src=\\\"/static/device-provider-resolution.js\\\"></script>')", text)\n        self.assertIn("required.append('<script src=\\\"/static/policy-effective-state.js\\\"></script>')", text)\n        self.assertLess(\n            text.index("required.append('<script src=\\\"/static/device-provider-resolution.js\\\"></script>')"),\n            text.index("required.append('<script src=\\\"/static/policy-effective-state.js\\\"></script>')"),\n        )\n'''
          test.write_text(test_text.replace(marker, addition + marker, 1), encoding='utf-8')
          PY

          rm -f .github/workflows/repair-059-promotion-v10-r3.yml
          rm -f SOURCE-MANIFEST.sha256
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          root = Path.cwd()
          ignored = {'.git', '__pycache__'}
          forbidden = {'.hc-dev', '.idea', '.vscode', 'dist', 'docs', 'ops', 'secrets'}
          records = []
          for directory, names, files in os.walk(root, topdown=True, followlinks=False):
              base = Path(directory)
              rel_dir = base.relative_to(root)
              names[:] = sorted(name for name in names if name not in ignored)
              if set(rel_dir.parts) & forbidden:
                  raise SystemExit(f'FORBIDDEN_SOURCE_DIRECTORY:{rel_dir.as_posix()}')
              for name in sorted(files):
                  path = base / name
                  rel = path.relative_to(root)
                  if name == 'SOURCE-MANIFEST.sha256' or set(rel.parts) & ignored:
                      continue
                  if set(rel.parts) & forbidden:
                      raise SystemExit(f'FORBIDDEN_SOURCE_PATH:{rel.as_posix()}')
                  if path.is_symlink() or not path.is_file() or path.suffix in {'.pyc', '.pyo'}:
                      raise SystemExit(f'SPECIAL_SOURCE_FILE:{rel.as_posix()}')
                  records.append((rel.as_posix(), hashlib.sha256(path.read_bytes()).hexdigest()))
          records.sort(key=lambda item: item[0])
          Path('SOURCE-MANIFEST.sha256').write_text(
              ''.join(f'{digest}  {rel}\n' for rel, digest in records),
              encoding='ascii',
          )
          PY

      - name: Qualify changed promotion boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 deploy/scripts/build-release.py verify-source --source-root .
          python3 -m unittest -v tests.test_stable_promotion_v10_contract
          PYTHONPATH=product/control-plane/src python3 -m unittest discover -v -s tests -p 'test_*.py'
          python3 tests/security_gate_public_release.py
          git diff --check

      - name: Commit exact tooling repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'HC 0.59: add guarded r3 promotion with policy Web wiring'
          git push origin HEAD:fix/0.59-promotion-v10-r3-b1
