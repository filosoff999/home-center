name: Prepare qualified Home Center stable promotion v4

on:
  create:

permissions:
  contents: write

concurrency:
  group: home-center-stable-promotion-v4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'ControlCenterSoft/home-center-stable' &&
      github.ref_type == 'branch' &&
      startsWith(github.ref_name, 'promote4/')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_REPOSITORY: ControlCenterSoft/home-center-development
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact stable boundary
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""

      - name: Resolve exact canonical release identity
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "$1" >&2; exit 66; }
          version="${GITHUB_REF_NAME#promote4/}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail PROMOTION_VERSION_REJECTED
          stable_base="$(git rev-parse HEAD)"
          main_record="$(git ls-remote --exit-code origin refs/heads/main)" || fail MAIN_IDENTITY_CHECK_FAILED
          [[ "$main_record" == "$stable_base"$'\trefs/heads/main' ]] || fail PROMOTION_NOT_CREATED_FROM_MAIN
          old_approved="$(python3 - <<'PY'
          import json
          print(json.load(open('APPROVED-SOURCE.json', encoding='utf-8'))['approved_revision'])
          PY
          )"
          test "$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/v$version" --jq .draft)" = "false" || fail SOURCE_RELEASE_DRAFT
          test "$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/v$version" --jq .prerelease)" = "false" || fail SOURCE_RELEASE_PRERELEASE
          asset_count="$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/v$version" --jq '.assets | length')"
          [[ "$asset_count" =~ ^[0-9]+$ ]] && (( asset_count >= 2 )) || fail SOURCE_RELEASE_ASSETS_INCOMPLETE
          git remote add approved "https://github.com/$SOURCE_REPOSITORY.git"
          git fetch --no-tags approved main
          git fetch --force approved "refs/tags/v$version:refs/tags/source-v$version"
          git cat-file -e "$old_approved^{commit}" || fail APPROVED_REVISION_UNAVAILABLE
          source_sha="$(git rev-parse "refs/tags/source-v$version^{}")"
          test "$(git show "$source_sha:VERSION")" = "$version" || fail SOURCE_VERSION_MISMATCH
          git merge-base --is-ancestor "$old_approved" "$source_sha" || fail SOURCE_NOT_DESCENDANT_OF_APPROVED_BASE
          git worktree add --detach "$RUNNER_TEMP/source" "$source_sha"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable_base=$stable_base" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Project approved delta into hardened public tree
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/source" "$VERSION" <<'PY'
          import json, re, shutil, sys
          from pathlib import Path
          source=Path(sys.argv[1]); version=sys.argv[2]; root=Path.cwd()
          provenance=json.loads((root/'APPROVED-SOURCE.json').read_text(encoding='utf-8'))
          old_version=provenance['version']; previous={x['path']:x for x in provenance['files']}
          forbidden={'.git','__pycache__','dist','.hc-dev','.idea','.vscode','docs','ops','secrets'}
          def excluded(rel):
              parts=set(rel.split('/'))
              return bool(parts & forbidden) or rel=='GEMINI.md' or rel.startswith('.github/') or rel.startswith('contracts/releases/') or rel.endswith(('.pyc','.pyo'))
          current=set()
          for path in sorted(source.rglob('*')):
              if not path.is_file() or path.is_symlink(): continue
              rel=path.relative_to(source).as_posix(); current.add(rel)
              if excluded(rel): continue
              prior=previous.get(rel)
              if prior is not None and prior['disposition'] in {'excluded','adapted'}: continue
              target=root/rel; target.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(path,target)
          for rel,prior in previous.items():
              if prior['disposition']=='identical' and rel not in current and not excluded(rel):
                  target=root/rel
                  if target.is_file() and not target.is_symlink(): target.unlink()
          for name in ('docs','dist','ops','secrets','.hc-dev'):
              shutil.rmtree(root/name,ignore_errors=True)
          for path in list(root.rglob('__pycache__')):
              if path.is_dir(): shutil.rmtree(path)
          for path in list(root.rglob('*.pyc'))+list(root.rglob('*.pyo')):
              if path.is_file(): path.unlink()
          gemini=root/'GEMINI.md'
          if gemini.is_file(): gemini.unlink()
          openapi=root/'contracts/openapi'
          if openapi.is_dir():
              for path in openapi.iterdir():
                  if path.is_file() and path.name!='home-center.v1.openapi.json': path.unlink()
          for name in ('README.md','INSTALL.md','RELEASE.md','contracts/README.md'):
              path=root/name
              if path.is_file():
                  text=path.read_text(encoding='utf-8').replace(f'v{old_version}',f'v{version}').replace(old_version,version)
                  path.write_text(text,encoding='utf-8')
          pyproject=root/'pyproject.toml'
          if pyproject.is_file():
              text=pyproject.read_text(encoding='utf-8')
              text,n=re.subn(r'(?m)^version\s*=\s*"[0-9]+\.[0-9]+\.[0-9]+"\s*$',f'version = "{version}"',text,count=1)
              if n!=1: raise SystemExit('PUBLIC_PROJECT_VERSION_UPDATE_FAILED')
              pyproject.write_text(text,encoding='utf-8')
          release_js=root/'product/web/static/release.js'
          if release_js.is_file():
              release_js.write_text(re.sub(r'version:\s*"[0-9]+\.[0-9]+\.[0-9]+"',f'version: "{version}"',release_js.read_text(encoding='utf-8'),count=1),encoding='utf-8')
          index=root/'product/web/static/index.html'
          if index.is_file(): index.write_text(index.read_text(encoding='utf-8').replace(old_version,version),encoding='utf-8')
          for wf in ('promote-qualified-stable.yml','promote-qualified-stable-v2.yml','promote-qualified-stable-v3.yml','promote-qualified-stable-v4.yml'):
              path=root/'.github/workflows'/wf
              if path.is_file(): path.unlink()
          if (root/'VERSION').read_text(encoding='ascii').strip()!=version: raise SystemExit('PUBLIC_VERSION_MISMATCH')
          PY

      - name: Rebuild exact provenance and manifest
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          STABLE_BASE: ${{ steps.identity.outputs.stable_base }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/source" "$SOURCE_SHA" "$STABLE_BASE" "$VERSION" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          source=Path(sys.argv[1]); source_sha,stable_base,version=sys.argv[2:]; root=Path.cwd()
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          files=[]
          for path in sorted(source.rglob('*'), key=lambda p: p.as_posix()):
              if not path.is_file() or path.is_symlink(): continue
              rel=path.relative_to(source).as_posix(); parts=set(rel.split('/'))
              if parts & {'.git','__pycache__','dist'} or rel.endswith(('.pyc','.pyo')): continue
              approved=sha(path); stable=root/rel
              if stable.is_file() and not stable.is_symlink():
                  stable_sha=sha(stable); disposition='identical' if stable_sha==approved else 'adapted'; reason='approved-byte-copy' if disposition=='identical' else 'hardened-stable-integration'
              else:
                  stable_sha=None; disposition='excluded'
                  reason='stable-release-boundary' if rel.startswith('.github/') else ('stable-release-documentation' if rel.startswith('docs/') or rel=='GEMINI.md' else 'stable-public-surface')
              files.append({'path':rel,'approved_sha256':approved,'disposition':disposition,'stable_sha256':stable_sha,'reason':reason})
          rows=''.join(f"{x['approved_sha256']}  {x['path']}\n" for x in files).encode(); counts={n:sum(x['disposition']==n for x in files) for n in ('identical','adapted','excluded')}
          value={'schema':'home-center.approved-source-provenance.v1','product':'home-center','version':version,'approved_repository':'ControlCenterSoft/home-center-development','approved_revision':source_sha,'approved_manifest_sha256':hashlib.sha256(rows).hexdigest(),'stable_release_boundary_revision':stable_base,'summary':{'total':len(files),**counts},'files':files}
          Path('APPROVED-SOURCE.json').write_text(json.dumps(value,indent=2,ensure_ascii=True)+'\n',encoding='utf-8')
          PY
          python3 - "$SOURCE_SHA" "$STABLE_BASE" <<'PY'
          from pathlib import Path
          import re,sys
          source_sha,stable_base=sys.argv[1:]; path=Path('tests/test_approved_source.py')
          if path.is_file():
              text=path.read_text(encoding='utf-8')
              text,n1=re.subn(r'APPROVED_REVISION = "[0-9a-f]{40}"',f'APPROVED_REVISION = "{source_sha}"',text,count=1)
              text,n2=re.subn(r'STABLE_RELEASE_BOUNDARY_REVISION = "[0-9a-f]{40}"',f'STABLE_RELEASE_BOUNDARY_REVISION = "{stable_base}"',text,count=1)
              if (n1,n2)!=(1,1): raise SystemExit('PROVENANCE_TEST_CONSTANT_UPDATE_FAILED')
              path.write_text(text,encoding='utf-8')
          PY
          rm -f SOURCE-MANIFEST.sha256
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          root=Path.cwd(); ignored={'.git','__pycache__'}; forbidden={'.hc-dev','.idea','.vscode','dist','docs','ops','secrets'}; records=[]
          for directory,names,files in os.walk(root,topdown=True,followlinks=False):
              base=Path(directory); rel_dir=base.relative_to(root)
              names[:]=sorted(n for n in names if n not in ignored)
              if set(rel_dir.parts)&forbidden: raise SystemExit(f'FORBIDDEN_SOURCE_DIRECTORY:{rel_dir.as_posix()}')
              for name in sorted(files):
                  path=base/name; rel=path.relative_to(root)
                  if name=='SOURCE-MANIFEST.sha256' or set(rel.parts)&ignored: continue
                  if set(rel.parts)&forbidden: raise SystemExit(f'FORBIDDEN_SOURCE_PATH:{rel.as_posix()}')
                  if path.is_symlink() or not path.is_file() or path.suffix in {'.pyc','.pyo'}: raise SystemExit(f'SPECIAL_SOURCE_FILE:{rel.as_posix()}')
                  records.append((rel.as_posix(),hashlib.sha256(path.read_bytes()).hexdigest()))
          records.sort(key=lambda item:item[0])
          Path('SOURCE-MANIFEST.sha256').write_text(''.join(f'{digest}  {rel}\n' for rel,digest in records),encoding='ascii')
          PY

      - name: Run affected public-export deterministic qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 deploy/scripts/build-release.py verify-source --source-root .
          PYTHONPATH=product/control-plane/src python3 -m unittest discover -v -s tests -p 'test_*.py'
          python3 tests/security_gate_public_release.py
          PYTHONPATH=product/control-plane/src python3 -c 'import home_center.actions, home_center.api, home_center.module_admission, home_center.server'

      - name: Commit exact public candidate
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "release: prepare Home Center $VERSION stable promotion"
          git push origin "HEAD:$GITHUB_REF_NAME"
          printf 'HOME_CENTER_STABLE_PROMOTION=PASS version=%s candidate=%s\n' "$VERSION" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
