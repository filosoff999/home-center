name: Verify versioned Home Center public source

on:
  pull_request:
  push:
    branches:
      - main
      - "publish/**"
      - "release/**"

permissions:
  contents: read

concurrency:
  group: home-center-public-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'ControlCenterSoft/home-center-stable'
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Establish exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo EXACT_HEAD_MISMATCH >&2; exit 66; }
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo SOURCE_TREE_DIRTY >&2; exit 66; }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""

      - name: Verify source, runtime, and security contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 deploy/scripts/build-release.py verify-source --source-root .
          PYTHONPATH=product/control-plane/src python3 -m unittest -v tests/test_public_release.py
          python3 tests/security_gate_public_release.py
          PYTHONPATH=product/control-plane/src python3 -c 'import home_center.actions, home_center.api, home_center.module_admission, home_center.server'
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo SOURCE_TREE_MUTATED >&2; exit 66; }

  qualify:
    if: github.repository == 'ControlCenterSoft/home-center-stable'
    name: Reproducible release candidate
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""

      - name: Build and verify candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo EXACT_HEAD_MISMATCH >&2; exit 66; }
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo SOURCE_TREE_DIRTY >&2; exit 66; }
          epoch="$(git show -s --format=%ct "$EXPECTED_SHA")"
          [[ "$epoch" =~ ^[1-9][0-9]{8,11}$ ]] || { echo SOURCE_DATE_EPOCH_REJECTED >&2; exit 66; }
          candidate="$RUNNER_TEMP/home-center-release-$EXPECTED_SHA"
          GITHUB_SHA="$EXPECTED_SHA" python3 deploy/scripts/build-release.py candidate \
            --source-root . \
            --output "$candidate" \
            --revision "$EXPECTED_SHA" \
            --source-date-epoch "$epoch"
          python3 deploy/scripts/build-release.py verify \
            --directory "$candidate" \
            --revision "$EXPECTED_SHA" \
            --source-date-epoch "$epoch"
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo SOURCE_TREE_MUTATED >&2; exit 66; }
