name: Diagnose Home Center public promotion manifest

on:
  pull_request:

permissions:
  contents: read

jobs:
  hash-promotion-workflow:
    if: github.repository == 'ControlCenterSoft/home-center-stable'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Print exact promotion workflow SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          sha256sum .github/workflows/promote-qualified-stable-v9.yml
