name: Refresh stable tooling manifest 0.46

on:
  push:
    branches:
      - tooling/public-promotion-v7-0.46

permissions:
  contents: write

concurrency:
  group: home-center-stable-tooling-manifest-046
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact tooling head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Remove one-shot workflow and rebuild closed source manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/tooling-manifest-refresh-046.yml
          rm -f SOURCE-MANIFEST.sha256
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os

          root = Path.cwd()
          ignored = {'.git', '__pycache__'}
          forbidden = {'.hc-dev', '.idea', '.vscode', 'dist', 'docs', 'ops', 'secrets'}
          records = []
          for directory, names, files in os.walk(root, topdown=True, followlinks=False):
              base = Path(directory)
              rel_dir = base.relative_to(root)
              names[:] = sorted(name for name in names if name not in ignored)
              if set(rel_dir.parts) & forbidden:
                  raise SystemExit(f'FORBIDDEN_SOURCE_DIRECTORY:{rel_dir.as_posix()}')
              for name in sorted(files):
                  path = base / name
                  rel = path.relative_to(root)
                  if name == 'SOURCE-MANIFEST.sha256' or set(rel.parts) & ignored:
                      continue
                  if set(rel.parts) & forbidden:
                      raise SystemExit(f'FORBIDDEN_SOURCE_PATH:{rel.as_posix()}')
                  if path.is_symlink() or not path.is_file() or path.suffix in {'.pyc', '.pyo'}:
                      raise SystemExit(f'SPECIAL_SOURCE_FILE:{rel.as_posix()}')
                  records.append((rel.as_posix(), hashlib.sha256(path.read_bytes()).hexdigest()))
          records.sort(key=lambda item: item[0])
          Path('SOURCE-MANIFEST.sha256').write_text(
              ''.join(f'{digest}  {rel}\n' for rel, digest in records),
              encoding='ascii',
          )
          PY

      - name: Validate exact tooling restoration
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(sha256sum .github/workflows/promote-qualified-stable-v7.yml | awk '{print $1}')" = "8fc7b3c260ffde9047513d2c65fcf7c35d8cadf5008896e78ce861a213f35d3f"
          grep -Fxq "8fc7b3c260ffde9047513d2c65fcf7c35d8cadf5008896e78ce861a213f35d3f  .github/workflows/promote-qualified-stable-v7.yml" SOURCE-MANIFEST.sha256
          python3 deploy/scripts/build-release.py verify-source --source-root .
          git diff --check

      - name: Commit closed tooling boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'HC stable: close 0.46 promotion tooling manifest'
          git push origin HEAD:tooling/public-promotion-v7-0.46
