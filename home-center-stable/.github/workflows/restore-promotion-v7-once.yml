name: Restore Home Center stable promotion tooling v7 once

on:
  push:
    branches:
      - tooling/public-promotion-v7-0.47

permissions:
  contents: write

concurrency:
  group: restore-home-center-stable-promotion-v7-once
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact tooling branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore previously qualified promotion workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          target='.github/workflows/promote-qualified-stable-v7.yml'
          mkdir -p .github/workflows
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/ControlCenterSoft/home-center-stable/15dc05efc87b7c71e420fabaa9fbadbb18cdc646/.github/workflows/promote-qualified-stable-v7.yml' \
            -o "$target"
          printf '%s  %s\n' '8fc7b3c260ffde9047513d2c65fcf7c35d8cadf5008896e78ce861a213f35d3f' "$target" | sha256sum -c -

      - name: Remove one-shot helper and rebuild closed source manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/restore-promotion-v7-once.yml
          rm -f SOURCE-MANIFEST.sha256
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          root = Path.cwd()
          ignored = {'.git','__pycache__'}
          forbidden = {'.hc-dev','.idea','.vscode','dist','docs','ops','secrets'}
          records = []
          for directory, names, files in os.walk(root, topdown=True, followlinks=False):
              base = Path(directory)
              rel_dir = base.relative_to(root)
              names[:] = sorted(name for name in names if name not in ignored)
              if set(rel_dir.parts) & forbidden:
                  raise SystemExit(f'FORBIDDEN_SOURCE_DIRECTORY:{rel_dir.as_posix()}')
              for name in sorted(files):
                  path = base / name
                  rel = path.relative_to(root)
                  if name == 'SOURCE-MANIFEST.sha256' or set(rel.parts) & ignored:
                      continue
                  if set(rel.parts) & forbidden:
                      raise SystemExit(f'FORBIDDEN_SOURCE_PATH:{rel.as_posix()}')
                  if path.is_symlink() or not path.is_file() or path.suffix in {'.pyc','.pyo'}:
                      raise SystemExit(f'SPECIAL_SOURCE_FILE:{rel.as_posix()}')
                  records.append((rel.as_posix(), hashlib.sha256(path.read_bytes()).hexdigest()))
          records.sort(key=lambda item: item[0])
          Path('SOURCE-MANIFEST.sha256').write_text(
              ''.join(f'{digest}  {rel}\n' for rel, digest in records), encoding='ascii'
          )
          PY
          python3 deploy/scripts/build-release.py verify-source --source-root .

      - name: Commit exact reusable tooling state
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/promote-qualified-stable-v7.yml\n.github/workflows/restore-promotion-v7-once.yml\nSOURCE-MANIFEST.sha256'
          git commit -m 'HC stable: restore guarded promotion tooling for 0.47'
          git push origin HEAD:tooling/public-promotion-v7-0.47
