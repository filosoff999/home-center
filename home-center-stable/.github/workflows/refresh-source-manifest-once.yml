name: Refresh Home Center source manifest once

on:
  push:
    branches:
      - fix/0.52-runtime-sidecar
    paths:
      - .github/workflows/refresh-source-manifest-once.yml

permissions:
  contents: write

concurrency:
  group: home-center-refresh-source-manifest-once
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'ControlCenterSoft/home-center-stable'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: fix/0.52-runtime-sidecar
          persist-credentials: true

      - name: Regenerate canonical source manifest and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo EXACT_HEAD_MISMATCH >&2; exit 66; }
          rm -f .github/workflows/refresh-source-manifest-once.yml
          rm -f SOURCE-MANIFEST.sha256
          python3 - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          tool = Path('deploy/scripts/build-release.py').resolve()
          spec = importlib.util.spec_from_file_location('home_center_public_release_refresh', tool)
          if spec is None or spec.loader is None:
              raise SystemExit('RELEASE_TOOL_IMPORT_FAILED')
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.create_source_manifest(Path('.').resolve())
          module.verify_source_manifest(Path('.').resolve())
          PY
          git diff --check
          git status --short
          git config user.name 'ControlCenterSoft'
          git config user.email '40738562+ControlCenterSoft@users.noreply.github.com'
          git add -A SOURCE-MANIFEST.sha256 .github/workflows/refresh-source-manifest-once.yml
          git diff --cached --exit-code && { echo NO_MANIFEST_CHANGE >&2; exit 66; } || true
          git commit -m 'HC stable: refresh source manifest for updater sidecar workflow'
          git push origin HEAD:fix/0.52-runtime-sidecar
