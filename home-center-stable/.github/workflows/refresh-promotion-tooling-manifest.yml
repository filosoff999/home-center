name: Refresh stable promotion tooling manifest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-hc062-stable-promotion-tooling
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'ControlCenterSoft/home-center-stable' && github.ref_name == 'qualification/hc062-stable-promotion-tooling-b3-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact tooling branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Remove one-shot helper and rebuild exact source manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/refresh-promotion-tooling-manifest.yml
          rm -f SOURCE-MANIFEST.sha256
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          root = Path.cwd()
          ignored = {'.git','__pycache__'}
          forbidden = {'.hc-dev','.idea','.vscode','dist','docs','ops','secrets'}
          records = []
          for directory, names, files in os.walk(root, topdown=True, followlinks=False):
              base = Path(directory)
              rel_dir = base.relative_to(root)
              names[:] = sorted(name for name in names if name not in ignored)
              if set(rel_dir.parts) & forbidden:
                  raise SystemExit(f'FORBIDDEN_SOURCE_DIRECTORY:{rel_dir.as_posix()}')
              for name in sorted(files):
                  path = base / name
                  rel = path.relative_to(root)
                  if name == 'SOURCE-MANIFEST.sha256' or set(rel.parts) & ignored:
                      continue
                  if set(rel.parts) & forbidden:
                      raise SystemExit(f'FORBIDDEN_SOURCE_PATH:{rel.as_posix()}')
                  if path.is_symlink() or not path.is_file() or path.suffix in {'.pyc','.pyo'}:
                      raise SystemExit(f'SPECIAL_SOURCE_FILE:{rel.as_posix()}')
                  records.append((rel.as_posix(), hashlib.sha256(path.read_bytes()).hexdigest()))
          records.sort(key=lambda item: item[0])
          Path('SOURCE-MANIFEST.sha256').write_text(
              ''.join(f'{digest}  {rel}\n' for rel, digest in records), encoding='ascii'
          )
          PY

      - name: Qualify exact repaired tooling tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 deploy/scripts/build-release.py verify-source --source-root .
          python3 -m unittest -v tests.test_stable_promotion_v10_contract
          PYTHONPATH=product/control-plane/src python3 -m unittest discover -v -s tests -p 'test_*.py'
          python3 tests/security_gate_public_release.py
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -v '^ M SOURCE-MANIFEST.sha256$' || true)" || true

      - name: Commit exact tooling restoration
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'release: restore guarded Stable promotion tooling for 0.62.0'
          git push origin "HEAD:${GITHUB_REF_NAME}"
