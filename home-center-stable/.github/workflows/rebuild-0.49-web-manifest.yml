name: Rebuild 0.49 public Web manifest

on:
  push:
    branches:
      - fix/0.49-public-web-shape-b2

permissions:
  contents: write

concurrency:
  group: hc-stable-rebuild-049-web-manifest
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.repository == 'ControlCenterSoft/home-center-stable'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Rebuild closed source manifest and remove helper
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/rebuild-0.49-web-manifest.yml
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          root = Path.cwd()
          ignored = {'.git', '__pycache__'}
          records = []
          for directory, names, files in os.walk(root, topdown=True, followlinks=False):
              base = Path(directory)
              names[:] = sorted(name for name in names if name not in ignored)
              for name in sorted(files):
                  path = base / name
                  rel = path.relative_to(root)
                  if name == 'SOURCE-MANIFEST.sha256' or set(rel.parts) & ignored:
                      continue
                  if path.is_symlink() or not path.is_file() or path.suffix in {'.pyc', '.pyo'}:
                      raise SystemExit(f'SPECIAL_SOURCE_FILE:{rel.as_posix()}')
                  records.append((rel.as_posix(), hashlib.sha256(path.read_bytes()).hexdigest()))
          records.sort(key=lambda item: item[0])
          Path('SOURCE-MANIFEST.sha256').write_text(
              ''.join(f'{digest}  {rel}\n' for rel, digest in records),
              encoding='ascii',
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo NO_MANIFEST_CHANGE >&2; exit 66; }
          git commit -m 'HC stable: rebuild manifest for 0.49 Web boundary'
          git push origin HEAD:${GITHUB_REF_NAME}
