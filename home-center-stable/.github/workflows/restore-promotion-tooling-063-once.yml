name: Restore HC 0.63 Stable promotion tooling once

on:
  push:
    branches:
      - qualification/hc063-stable-promotion-tooling-b1-20260913
    paths:
      - .github/workflows/restore-promotion-tooling-063-once.yml

permissions:
  contents: write

concurrency:
  group: hc063-stable-tooling-once
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact tooling branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current Stable base
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "qualification/hc063-stable-promotion-tooling-b1-20260913"
          base="$(git rev-parse HEAD^)"
          main_record="$(git ls-remote --exit-code origin refs/heads/main)"
          [[ "$main_record" == "$base"$'\trefs/heads/main' ]] || { echo STABLE_BASE_DRIFT >&2; exit 66; }

      - name: Restore previously qualified guarded promotion tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin qualification/hc062-stable-promotion-tooling-b3-20260913
          mkdir -p .github/workflows tests
          git show FETCH_HEAD:.github/workflows/promote-qualified-stable-v10.yml > .github/workflows/promote-qualified-stable-v10.yml
          git show FETCH_HEAD:tests/test_stable_promotion_v10_contract.py > tests/test_stable_promotion_v10_contract.py
          rm -f .github/workflows/restore-promotion-tooling-063-once.yml

      - name: Rebuild exact source manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f SOURCE-MANIFEST.sha256
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          root = Path.cwd()
          ignored = {'.git', '__pycache__'}
          forbidden = {'.hc-dev', '.idea', '.vscode', 'dist', 'docs', 'ops', 'secrets'}
          records = []
          for directory, names, files in os.walk(root, topdown=True, followlinks=False):
              base = Path(directory)
              rel_dir = base.relative_to(root)
              names[:] = sorted(name for name in names if name not in ignored)
              if set(rel_dir.parts) & forbidden:
                  raise SystemExit(f'FORBIDDEN_SOURCE_DIRECTORY:{rel_dir.as_posix()}')
              for name in sorted(files):
                  path = base / name
                  rel = path.relative_to(root)
                  if name == 'SOURCE-MANIFEST.sha256' or set(rel.parts) & ignored:
                      continue
                  if set(rel.parts) & forbidden:
                      raise SystemExit(f'FORBIDDEN_SOURCE_PATH:{rel.as_posix()}')
                  if path.is_symlink() or not path.is_file() or path.suffix in {'.pyc', '.pyo'}:
                      raise SystemExit(f'SPECIAL_SOURCE_FILE:{rel.as_posix()}')
                  records.append((rel.as_posix(), hashlib.sha256(path.read_bytes()).hexdigest()))
          records.sort(key=lambda item: item[0])
          Path('SOURCE-MANIFEST.sha256').write_text(
              ''.join(f'{digest}  {rel}\n' for rel, digest in records), encoding='ascii'
          )
          PY

      - name: Qualify exact restored tooling tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 deploy/scripts/build-release.py verify-source --source-root .
          python3 -m unittest -v tests.test_stable_promotion_v10_contract
          PYTHONPATH=product/control-plane/src python3 -m unittest discover -v -s tests -p 'test_*.py'
          python3 tests/security_gate_public_release.py
          PYTHONPATH=product/control-plane/src python3 -c 'import home_center.actions, home_center.api, home_center.module_admission, home_center.server'
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -vE "^( M|M |A | D|D |\?\?) (SOURCE-MANIFEST\.sha256|\.github/workflows/promote-qualified-stable-v10\.yml|tests/test_stable_promotion_v10_contract\.py|\.github/workflows/restore-promotion-tooling-063-once\.yml)$" || true)" || { git status --short >&2; exit 66; }

      - name: Commit final self-contained tooling tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A SOURCE-MANIFEST.sha256 .github/workflows tests/test_stable_promotion_v10_contract.py
          git diff --cached --check
          git commit -m "HC 0.63: restore guarded Stable promotion tooling"
          git push origin "HEAD:$GITHUB_REF_NAME"
