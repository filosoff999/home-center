name: Regenerate Stable promotion manifest once

on:
  push:
    branches:
      - tooling/restore-promotion-v10-for-059-b3

permissions:
  contents: write

concurrency:
  group: hc-stable-promotion-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.repository == 'ControlCenterSoft/home-center-stable'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}
      - name: Rebuild exact source manifest and remove this helper
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm .github/workflows/regen-promotion-manifest-once.yml
          rm SOURCE-MANIFEST.sha256
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('deploy/scripts/build-release.py')
          spec = importlib.util.spec_from_file_location('hc_build_release_manifest', path)
          if spec is None or spec.loader is None:
              raise SystemExit('BUILD_RELEASE_IMPORT_FAILED')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.create_source_manifest(Path.cwd())
          PY
          python3 deploy/scripts/build-release.py verify-source --source-root .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo NO_MANIFEST_CHANGE >&2; exit 66; }
          git commit -m 'chore: bind Stable promotion tooling into source manifest'
          git push origin "HEAD:${GITHUB_REF_NAME}"
