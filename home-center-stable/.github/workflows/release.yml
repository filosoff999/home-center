name: Publish versioned Home Center stable release

on:
  create:

concurrency:
  group: publish-home-center-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: >-
      github.repository == 'ControlCenterSoft/home-center-stable' &&
      github.ref_type == 'branch' &&
      startsWith(github.ref_name, 'release/')
    name: Release gate Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      EXPECTED_SHA: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Establish exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo EXACT_HEAD_MISMATCH >&2; exit 66; }
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo SOURCE_TREE_DIRTY >&2; exit 66; }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""

      - name: Run public product and security gates
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 deploy/scripts/build-release.py verify-source --source-root .
          PYTHONPATH=product/control-plane/src python3 -m unittest discover -v -s tests -p 'test_*.py'
          python3 tests/security_gate_public_release.py
          PYTHONPATH=product/control-plane/src python3 -c 'import home_center.actions, home_center.api, home_center.module_admission, home_center.server'
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo SOURCE_TREE_MUTATED >&2; exit 66; }

  qualify:
    if: >-
      github.repository == 'ControlCenterSoft/home-center-stable' &&
      github.ref_type == 'branch' &&
      startsWith(github.ref_name, 'release/')
    name: Qualify exact release branch
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      candidate_name: ${{ steps.identity.outputs.candidate_name }}
      release_branch: ${{ steps.identity.outputs.release_branch }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      source_date_epoch: ${{ steps.identity.outputs.source_date_epoch }}
      version: ${{ steps.identity.outputs.version }}
    env:
      CREATED_BRANCH: ${{ github.ref_name }}
      REVISION: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.REVISION }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""

      - name: Verify version, exact main identity, and release vacancy
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          fail() { echo "$1" >&2; exit 66; }
          require_tag_vacant() {
            local output status
            set +e
            output="$(git ls-remote --exit-code origin "refs/tags/$1" 2>&1)"
            status=$?
            set -e
            case "$status" in
              0) fail RELEASE_TAG_ALREADY_EXISTS ;;
              2) test -z "$output" || fail RELEASE_TAG_VACANCY_AMBIGUOUS ;;
              *) printf '%s\n' "$output" >&2; fail RELEASE_TAG_VACANCY_CHECK_FAILED ;;
            esac
          }
          require_release_vacant() {
            local error_file="$RUNNER_TEMP/release-vacancy.err"
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$1" >/dev/null 2>"$error_file"; then
              fail RELEASE_ALREADY_EXISTS
            fi
            grep -Eq '\(HTTP 404\)$' "$error_file" || {
              cat "$error_file" >&2
              fail RELEASE_VACANCY_CHECK_FAILED
            }
          }

          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo REVISION_REJECTED >&2; exit 64; }
          test "$(git rev-parse HEAD)" = "$REVISION" || fail EXACT_HEAD_MISMATCH
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || fail SOURCE_TREE_DIRTY

          version="$(python3 deploy/scripts/build-release.py source-version --source-root .)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail VERSION_REJECTED
          release_branch="release/$version"
          release_tag="v$version"
          test "$CREATED_BRANCH" = "$release_branch" || fail RELEASE_BRANCH_VERSION_MISMATCH

          main_record="$(git ls-remote --exit-code origin refs/heads/main)" || fail MAIN_IDENTITY_CHECK_FAILED
          [[ "$main_record" == "$REVISION"$'\trefs/heads/main' ]] || fail MAIN_HEAD_MISMATCH
          require_tag_vacant "$release_tag"
          require_release_vacant "$release_tag"

          epoch="$(git show -s --format=%ct "$REVISION")"
          [[ "$epoch" =~ ^[1-9][0-9]{8,11}$ ]] || fail SOURCE_DATE_EPOCH_REJECTED
          candidate_name="home-center-$version-qualified-$REVISION"
          echo "candidate_name=$candidate_name" >> "$GITHUB_OUTPUT"
          echo "release_branch=$release_branch" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run public product gates
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 deploy/scripts/build-release.py verify-source --source-root .
          PYTHONPATH=product/control-plane/src python3 -m unittest discover -v -s tests -p 'test_*.py'
          python3 tests/security_gate_public_release.py
          PYTHONPATH=product/control-plane/src python3 -c 'import home_center.actions, home_center.api, home_center.module_admission, home_center.server'
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo SOURCE_TREE_MUTATED >&2; exit 66; }

      - name: Build and verify the release candidate once
        shell: bash
        env:
          CANDIDATE_NAME: ${{ steps.identity.outputs.candidate_name }}
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.source_date_epoch }}
        run: |
          set -Eeuo pipefail
          candidate="$RUNNER_TEMP/$CANDIDATE_NAME"
          GITHUB_SHA="$REVISION" python3 deploy/scripts/build-release.py candidate \
            --source-root . \
            --output "$candidate" \
            --revision "$REVISION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          python3 deploy/scripts/build-release.py verify \
            --directory "$candidate" \
            --revision "$REVISION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo SOURCE_TREE_MUTATED >&2; exit 66; }

      - name: Upload exact qualified candidate
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identity.outputs.candidate_name }}
          path: ${{ runner.temp }}/${{ steps.identity.outputs.candidate_name }}/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  publish:
    name: Publish reused candidate
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    env:
      CREATED_BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      QUALIFIED_ARTIFACT_ID: ${{ needs.qualify.outputs.artifact_id }}
      RELEASE_BRANCH: ${{ needs.qualify.outputs.release_branch }}
      RELEASE_TAG: ${{ needs.qualify.outputs.release_tag }}
      REVISION: ${{ github.sha }}
      SOURCE_DATE_EPOCH: ${{ needs.qualify.outputs.source_date_epoch }}
      VERSION: ${{ needs.qualify.outputs.version }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout the same qualified commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.REVISION }}

      - name: Download the exact candidate from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true

      - name: Recheck identity, vacancy, and qualified candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "$1" >&2; exit 66; }
          require_tag_vacant() {
            local output status
            set +e
            output="$(git ls-remote --exit-code origin "refs/tags/$1" 2>&1)"
            status=$?
            set -e
            case "$status" in
              0) fail RELEASE_TAG_ALREADY_EXISTS ;;
              2) test -z "$output" || fail RELEASE_TAG_VACANCY_AMBIGUOUS ;;
              *) printf '%s\n' "$output" >&2; fail RELEASE_TAG_VACANCY_CHECK_FAILED ;;
            esac
          }
          require_release_vacant() {
            local error_file="$RUNNER_TEMP/release-vacancy.err"
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$1" >/dev/null 2>"$error_file"; then
              fail RELEASE_ALREADY_EXISTS
            fi
            grep -Eq '\(HTTP 404\)$' "$error_file" || {
              cat "$error_file" >&2
              fail RELEASE_VACANCY_CHECK_FAILED
            }
          }

          [[ "$QUALIFIED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || fail QUALIFIED_ARTIFACT_ID_REJECTED
          test "$(git rev-parse HEAD)" = "$REVISION" || fail EXACT_HEAD_MISMATCH
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || fail SOURCE_TREE_DIRTY
          source_version="$(python3 deploy/scripts/build-release.py source-version --source-root .)"
          test "$source_version" = "$VERSION" || fail QUALIFIED_VERSION_MISMATCH
          test "$CREATED_BRANCH" = "$RELEASE_BRANCH" || fail RELEASE_BRANCH_CHANGED
          test "$RELEASE_BRANCH" = "release/$VERSION" || fail RELEASE_BRANCH_VERSION_MISMATCH
          test "$RELEASE_TAG" = "v$VERSION" || fail RELEASE_TAG_VERSION_MISMATCH

          python3 deploy/scripts/build-release.py verify \
            --directory "$RUNNER_TEMP/candidate" \
            --revision "$REVISION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          main_record="$(git ls-remote --exit-code origin refs/heads/main)" || fail MAIN_IDENTITY_CHECK_FAILED
          [[ "$main_record" == "$REVISION"$'\trefs/heads/main' ]] || fail MAIN_HEAD_MISMATCH
          require_tag_vacant "$RELEASE_TAG"
          require_release_vacant "$RELEASE_TAG"

      - name: Create annotated release tag
        shell: bash
        run: |
          set -Eeuo pipefail
          tag_object="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="Home Center $VERSION" \
            -f object="$REVISION" \
            -f type='commit' --jq .sha)"
          [[ "$tag_object" =~ ^[0-9a-f]{40}$ ]] || { echo TAG_OBJECT_REJECTED >&2; exit 66; }
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$tag_object" >/dev/null

      - name: Create and publish release from reused assets
        shell: bash
        run: |
          set -Eeuo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            "Home Center $VERSION stable release." \
            '' \
            'Verify the downloaded files with SHA256SUMS, then inspect the embedded manifests, SPDX 2.3 SBOM, acceptance record, and release manifest before installation.' \
            > "$notes"
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/candidate/"* \
            --verify-tag \
            --draft \
            --title "Home Center $VERSION" \
            --notes-file "$notes"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest

      - name: Verify published tag and assets
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          mkdir "$RUNNER_TEMP/published"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/published"
          python3 deploy/scripts/build-release.py verify \
            --directory "$RUNNER_TEMP/published" \
            --revision "$REVISION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --release-json "$RUNNER_TEMP/release.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tag-ref.json"
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python3 - "$RUNNER_TEMP/tag-ref.json" <<'PY'
          import json, os, subprocess, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          if value.get("object", {}).get("type") != "tag":
              raise SystemExit("RELEASE_TAG_NOT_ANNOTATED")
          resolved = subprocess.run(
              ["git", "rev-parse", os.environ["RELEASE_TAG"] + "^{}"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if resolved != os.environ["REVISION"]:
              raise SystemExit("RELEASE_TAG_TARGET_MISMATCH")
          PY
          printf 'HOME_CENTER_PUBLIC_RELEASE=PASS version=%s exact_head=true artifact_id=%s artifact_reused=true\n' \
            "$VERSION" "$QUALIFIED_ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
