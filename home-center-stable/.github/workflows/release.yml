name: Publish Home Center 0.14.1

on:
  create:

concurrency:
  group: publish-home-center-v0.14.1
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.repository == 'ControlCenterSoft/home-center-stable' &&
      github.ref_type == 'branch' &&
      github.ref_name == 'release/0.14.1'
    name: Qualify exact release branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      source_date_epoch: ${{ steps.identity.outputs.source_date_epoch }}
    env:
      REVISION: ${{ github.sha }}
      CANDIDATE_NAME: home-center-release-${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.REVISION }}

      - name: Verify exact main identity and release vacancy
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.14.1
        run: |
          set -Eeuo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo REVISION_REJECTED >&2; exit 64; }
          test "$(git rev-parse HEAD)" = "$REVISION" || { echo EXACT_HEAD_MISMATCH >&2; exit 66; }
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo SOURCE_TREE_DIRTY >&2; exit 66; }
          main_head="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$main_head" = "$REVISION" || { echo MAIN_HEAD_MISMATCH >&2; exit 66; }
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo RELEASE_TAG_ALREADY_EXISTS >&2; exit 66
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo RELEASE_ALREADY_EXISTS >&2; exit 66
          fi
          epoch="$(git show -s --format=%ct "$REVISION")"
          [[ "$epoch" =~ ^[1-9][0-9]{8,11}$ ]] || { echo SOURCE_DATE_EPOCH_REJECTED >&2; exit 66; }
          echo "source_date_epoch=$epoch" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: ""

      - name: Run public product gates
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 deploy/scripts/build-release.py verify-source --source-root .
          PYTHONPATH=product/control-plane/src python3 tests/test_public_release_0141.py -v
          python3 tests/security_gate_public_0141.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo SOURCE_TREE_MUTATED >&2; exit 66; }

      - name: Build and verify the release candidate once
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.source_date_epoch }}
        run: |
          set -Eeuo pipefail
          candidate="$RUNNER_TEMP/$CANDIDATE_NAME"
          GITHUB_SHA="$REVISION" python3 deploy/scripts/build-release.py candidate \
            --source-root . \
            --output "$candidate" \
            --revision "$REVISION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          python3 deploy/scripts/build-release.py verify \
            --directory "$candidate" \
            --revision "$REVISION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo SOURCE_TREE_MUTATED >&2; exit 66; }

      - name: Upload exact qualified candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.CANDIDATE_NAME }}
          path: ${{ runner.temp }}/${{ env.CANDIDATE_NAME }}/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false

  publish:
    name: Publish reused candidate
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REVISION: ${{ github.sha }}
      SOURCE_DATE_EPOCH: ${{ needs.qualify.outputs.source_date_epoch }}
      RELEASE_TAG: v0.14.1
      CANDIDATE_NAME: home-center-release-${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout the same qualified commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.REVISION }}

      - name: Download the exact candidate from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.CANDIDATE_NAME }}
          path: ${{ runner.temp }}/candidate

      - name: Recheck identity, vacancy, and candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$REVISION" || { echo EXACT_HEAD_MISMATCH >&2; exit 66; }
          main_head="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$main_head" = "$REVISION" || { echo MAIN_HEAD_MISMATCH >&2; exit 66; }
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo RELEASE_TAG_ALREADY_EXISTS >&2; exit 66
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo RELEASE_ALREADY_EXISTS >&2; exit 66
          fi
          python3 deploy/scripts/build-release.py verify \
            --directory "$RUNNER_TEMP/candidate" \
            --revision "$REVISION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Create annotated release tag
        shell: bash
        run: |
          set -Eeuo pipefail
          tag_object="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message='Home Center 0.14.1' \
            -f object="$REVISION" \
            -f type='commit' --jq .sha)"
          [[ "$tag_object" =~ ^[0-9a-f]{40}$ ]] || { echo TAG_OBJECT_REJECTED >&2; exit 66; }
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$tag_object" >/dev/null

      - name: Create and publish release from reused assets
        shell: bash
        run: |
          set -Eeuo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            'Home Center 0.14.1 corrective release.' \
            '' \
            'Verify the downloaded files with SHA256SUMS, then inspect the embedded manifests, SPDX 2.3 SBOM, acceptance record, and release manifest before installation.' \
            > "$notes"
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/candidate/"* \
            --verify-tag \
            --draft \
            --title 'Home Center 0.14.1' \
            --notes-file "$notes"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest

      - name: Verify published tag and assets
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          mkdir "$RUNNER_TEMP/published"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/published"
          python3 deploy/scripts/build-release.py verify \
            --directory "$RUNNER_TEMP/published" \
            --revision "$REVISION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --release-json "$RUNNER_TEMP/release.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tag-ref.json"
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python3 - "$RUNNER_TEMP/tag-ref.json" <<'PY'
          import json, os, subprocess, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          if value.get("object", {}).get("type") != "tag":
              raise SystemExit("RELEASE_TAG_NOT_ANNOTATED")
          resolved = subprocess.run(
              ["git", "rev-parse", os.environ["RELEASE_TAG"] + "^{}"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if resolved != os.environ["REVISION"]:
              raise SystemExit("RELEASE_TAG_TARGET_MISMATCH")
          PY
          echo 'HOME_CENTER_PUBLIC_RELEASE_0_14_1=PASS exact_head=true artifact_reused=true' >> "$GITHUB_STEP_SUMMARY"
